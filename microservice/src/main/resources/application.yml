server:
  port: 8080

spring:
  application:
    name: microservice
  datasource:
    url: jdbc:h2:file:./data/usersdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
